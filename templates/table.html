<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Results</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
        }

        h2 {
            text-align: center;
            margin: 20px 0;
            color: #2c3e50;
        }

        .table-wrapper {
            margin: 20px;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 1200px;
            font-size: 13px;
        }

        thead {
            background-color: #1e88e5;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tbody tr:hover {
            background-color: #e3f2fd;
            transition: 0.2s;
        }

        /* Prediction column styling */
        td:last-child {
            font-weight: bold;
        }

        .legit {
            color: #1b5e20;
            background-color: #e8f5e9;
        }

        .phishing {
            color: #b71c1c;
            background-color: #ffebee;
        }

        footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<h2>🔍 Phishing Website Detection – Prediction Output</h2>

<div class="table-wrapper">
    {{ table | safe }}
</div>

<footer>
    Machine Learning Based Phishing Detection System
</footer>

</body>
</html>
